plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}



android {
  namespace = "com.lostexpedition.game"
  compileSdk = 35

  defaultConfig {
    applicationId 'com.lostexpedition.game'
    minSdkVersion 21
    targetSdkVersion 35
    versionCode 1
    versionName project.projectVersion
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      res.setSrcDirs(['res'])
      assets.setSrcDirs(['../assets'])
      jniLibs.srcDirs = ['libs']
    }
  }

  packagingOptions {
    resources.excludes += ['META-INF/robovm/ios/robovm.xml', '**/*.gwt.xml', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES*']
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled = true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  kotlinOptions {
    jvmTarget = '17'
  }
  buildToolsVersion '34.0.0'
}

configurations {
  natives
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

  // IMPORTANT: bibliotecile native trebuie declarate in configuratia 'natives',
  // NU ca 'implementation'. Cu 'implementation', fisierele .so raman in jar-uri
  // si nu ajung in APK => crash "libgdx.so not found" la pornire.
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

def nativeAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

nativeAbis.each { abi ->
  def taskName = "copyAndroidNatives_" + abi.replace('-', '_')
  tasks.register(taskName, Copy) {
    into file("libs/$abi")
    include '*.so'
    from configurations.natives.files
        .findAll { it.name.endsWith("natives-${abi}.jar") }
        .collect { zipTree(it) }
  }
}

tasks.register('copyAndroidNatives') {
  dependsOn nativeAbis.collect { "copyAndroidNatives_" + it.replace('-', '_') }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
  it.dependsOn 'copyAndroidNatives'
}

tasks.register('cleanAndroidNatives', Delete) {
  delete file('libs')
}

clean.dependsOn cleanAndroidNatives
